services:
  postgres:
    image: postgres:16-alpine
    container_name: reprieve-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reprieve
      POSTGRES_PASSWORD: reprieve
      POSTGRES_DB: reprieve_backend
    volumes:
      - reprieve_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprieve -d reprieve_backend"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reprieve-backend-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      CONTRACTS_CONFIG_DIR: /app/contracts-config
      INDEXER_RUN_IN_API: "true"
      NODE_ENV: production
      APP_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migration:run && npm run start:api:prod"
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reprieve-backend-indexer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      CONTRACTS_CONFIG_DIR: /app/contracts-config
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: npm run start:indexer:prod

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reprieve-backend-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      CONTRACTS_CONFIG_DIR: /app/contracts-config
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: npm run start:relay:prod

volumes:
  reprieve_postgres_data:
